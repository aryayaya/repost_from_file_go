name: Build and Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    name: Build Go binary for ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            os_name: linux
          - os: linux
            arch: arm64
            os_name: linux
          - os: darwin
            arch: amd64
            os_name: macos
          - os: darwin
            arch: arm64
            os_name: macos
          - os: windows
            arch: amd64
            os_name: windows
          - os: windows
            arch: arm64
            os_name: windows

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Wait for dependencies
        run: go mod download

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          BINARY_NAME=repost_from_file
          if [ "${{ matrix.os }}" = "windows" ]; then
            BINARY_NAME=${BINARY_NAME}.exe
          fi
          
          # Build standard version
          go build -o $BINARY_NAME .

      - name: Parse Release Tags
        id: vars
        run: |
          echo "tag=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT

      - name: Prepare Artifact
        id: prepare_artifact
        run: |
          ARCHIVE_NAME="repost_from_file_${{ steps.vars.outputs.tag }}_${{ matrix.os_name }}_${{ matrix.arch }}"
          
          # Copy binary and metadata into temporary folder
          mkdir $ARCHIVE_NAME
          
          if [ "${{ matrix.os }}" = "windows" ]; then
            cp repost_from_file.exe $ARCHIVE_NAME/
          else
            cp repost_from_file $ARCHIVE_NAME/
          fi
          cp README.md $ARCHIVE_NAME/
          
          # Compress based on platform
          if [ "${{ matrix.os }}" = "windows" ]; then
            zip -r ${ARCHIVE_NAME}.zip $ARCHIVE_NAME
            echo "archive=${ARCHIVE_NAME}.zip" >> $GITHUB_OUTPUT
          else
            tar -czvf ${ARCHIVE_NAME}.tar.gz $ARCHIVE_NAME
            echo "archive=${ARCHIVE_NAME}.tar.gz" >> $GITHUB_OUTPUT
          fi

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ steps.prepare_artifact.outputs.archive }}
