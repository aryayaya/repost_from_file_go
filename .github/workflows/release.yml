name: Build and Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    name: Build Go binary for ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            os_name: linux
          - os: linux
            arch: arm64
            os_name: linux
          - os: darwin
            arch: amd64
            os_name: macos
          - os: darwin
            arch: arm64
            os_name: macos
          - os: windows
            arch: amd64
            os_name: windows
          - os: windows
            arch: arm64
            os_name: windows

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Wait for dependencies
        run: go mod download

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          BINARY_NAME=repost_from_file
          if [ "${{ matrix.os }}" = "windows" ]; then
            BINARY_NAME=${BINARY_NAME}.exe
          fi
          
          # Build standard version
          go build -o $BINARY_NAME .

      - name: Parse Release Tags
        id: vars
        run: |
          echo "tag=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT

      - name: Prepare Artifact
        id: prepare_artifact
        run: |
          # 针对不同平台带上后缀，防止文件重名被覆盖
          if [ "${{ matrix.os }}" = "windows" ]; then
            FINAL_NAME="repost_from_file_${{ matrix.os_name }}_${{ matrix.arch }}.exe"
            mv repost_from_file.exe $FINAL_NAME
          else
            FINAL_NAME="repost_from_file_${{ matrix.os_name }}_${{ matrix.arch }}"
            mv repost_from_file $FINAL_NAME
          fi
          
          echo "file=$FINAL_NAME" >> $GITHUB_OUTPUT

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ steps.prepare_artifact.outputs.file }}

