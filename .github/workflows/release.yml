name: Build and Release

on:
  release:
    types: [created]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.2)'
        required: true
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  build:
    name: Build Go binary for ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            os_name: linux
          - os: linux
            arch: arm64
            os_name: linux
          - os: darwin
            arch: amd64
            os_name: macos
          - os: darwin
            arch: arm64
            os_name: macos
          - os: windows
            arch: amd64
            os_name: windows
          - os: windows
            arch: arm64
            os_name: windows

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Wait for dependencies
        run: go mod download

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          BINARY_NAME=repost_from_file
          if [ "${{ matrix.os }}" = "windows" ]; then
            BINARY_NAME=${BINARY_NAME}.exe
          fi
          
          # Build standard version
          go build -o $BINARY_NAME .

      - name: Prepare Artifact
        id: prepare_artifact
        run: |
          # 针对不同平台带上后缀，防止文件重名被覆盖
          if [ "${{ matrix.os }}" = "windows" ]; then
            FINAL_NAME="repost_from_file_${{ matrix.os_name }}_${{ matrix.arch }}.exe"
            mv repost_from_file.exe $FINAL_NAME
          else
            FINAL_NAME="repost_from_file_${{ matrix.os_name }}_${{ matrix.arch }}"
            mv repost_from_file $FINAL_NAME
          fi
          
          echo "file=$FINAL_NAME" >> $GITHUB_OUTPUT

      - name: Upload Artifact to Action
        uses: actions/upload-artifact@v4
        with:
          name: repost_from_file_${{ matrix.os_name }}_${{ matrix.arch }}
          path: ${{ steps.prepare_artifact.outputs.file }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: ${{ steps.prepare_artifact.outputs.file }}
          generate_release_notes: true

